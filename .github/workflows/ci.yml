name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.check.outputs.api }}
      app: ${{ steps.check.outputs.app }}
      admin: ${{ steps.check.outputs.admin }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        # Skip a job until its project has been scaffolded (see docs/setup.md).
        run: |
          echo "api=$([ -f api/composer.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "app=$([ -f app/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "admin=$([ -f admin/package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: periscope_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: periscope_test
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/phpstan analyse --no-progress
      - run: php artisan test

  frontend:
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: app
            mode: pwa
          - project: admin
            mode: spa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.project] == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs[matrix.project] == 'true'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - if: needs.changes.outputs[matrix.project] == 'true'
        run: npm ci
      - if: needs.changes.outputs[matrix.project] == 'true'
        run: npm run lint
      - if: needs.changes.outputs[matrix.project] == 'true'
        run: npx quasar build -m ${{ matrix.mode }}
